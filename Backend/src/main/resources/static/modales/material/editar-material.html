<div id="modalEditarMaterial" class="modal">
            <div class="modal-content">
              <span class="close-btn" id="closeEditarMaterial">&times;</span>
              <h2>Editar Material</h2>
              <form id="formEditarMaterial" class="modal-form">
                <div>
                  <label for="edit-codigo">Código</label>
                  <input
                    type="text"
                    id="edit-codigo"
                    name="codigo"
                    placeholder="Ingrese aquí"
                  />
                </div>
                <div>
                  <label for="edit-descripcion">Descripción</label>
                  <input
                    type="text"
                    id="edit-descripcion"
                    name="descripcion"
                    placeholder="Ingrese aquí"
                  />
                </div>
                <div>
                  <label for="edit-categoria">Categoría</label>
                  <select id="edit-categoria" name="categoria">
                    <option value="">Seleccione</option>
                    <option value="herramientas">Herramientas</option>
                    <option value="materiales-construccion">
                      Materiales de Construcción
                    </option>
                    <option value="electricidad">Electricidad</option>
                    <option value="plomeria">Plomería</option>
                    <option value="pintura">Pintura</option>
                    <option value="plasticos">Plásticos</option>
                  </select>
                </div>
                <div>
                  <label for="edit-precio-unidad">Precio por kilogramo</label>
                  <input
                    type="number"
                    id="edit-precio-unidad"
                    name="precio-unidad"
                    placeholder="Ingrese aquí"
                    step="0.01"
                  />
                </div>
                <div>
                  <label for="edit-precio-venta">Precio venta</label>
                  <input
                    type="number"
                    id="edit-precio-venta"
                    name="precio-venta"
                    placeholder="Ingrese aquí"
                    step="0.01"
                  />
                </div>
                <div>
                  <label for="edit-cantidad">Cantidad en kilogramo</label>
                  <input
                    type="number"
                    id="edit-cantidad"
                    name="cantidad"
                    placeholder="Ingrese aquí"
                    min="0"
                    step="0.01"
                  />
                </div>
                <button type="submit" class="btn-save">Guardar cambios</button>
              </form>
            </div>
          </div>
