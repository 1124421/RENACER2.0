spring.application.name=renacer
# ==================================
# 1. Configuracion del Servidor
# ==================================
server.port=8080

# ==================================
# 2. Configuracion de la Base de Datos (SQLite)
# ==================================
# La base de datos se creará automáticamente en la raíz del proyecto como renacer.db
# Si quieres una ubicación diferente, puedes usar una ruta absoluta como:
# spring.datasource.url=jdbc:sqlite:/ruta/completa/renacer.db
spring.datasource.url=jdbc:sqlite:renacer.db
spring.datasource.username=
spring.datasource.password=

# Driver de SQLite
spring.datasource.driver-class-name=org.sqlite.JDBC

# ==================================
# 3. Configuracion de JPA (Hibernate)
# ==================================
# Dialecto de Hibernate para SQLite
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Opciones de DDL (Data Definition Language)
# Esto es util en desarrollo para generar/actualizar el esquema.
# NOTA: En produccion, debe ser 'none' o 'validate'.
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (util para debugging)
spring.jpa.show-sql=true

# Configuraciones específicas para SQLite
# Deshabilitar el formato de salida SQL para mejor compatibilidad
spring.jpa.properties.hibernate.format_sql=false
# SQLite no soporta algunas características avanzadas de JPA
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Usar tipos de columna más compatibles con SQLite
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# ==================================
# 4. Configuracion de DevTools (Recarga Automática)
# ==================================
# Habilitar recarga automática de recursos estáticos
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

# Incluir recursos estáticos en la recarga
spring.devtools.restart.additional-paths=src/main/resources/static
spring.devtools.restart.exclude=static/**,templates/**
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

# Cache de recursos estáticos deshabilitado en desarrollo
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.static-locations=classpath:/static/

# Forzar actualización de recursos estáticos
spring.resources.chain.strategy.content.enabled=false
spring.resources.chain.strategy.fixed.enabled=false