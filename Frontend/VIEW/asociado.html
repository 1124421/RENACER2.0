<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/img/1.1.png" />
    <link rel="icon"type="image/png"href="assets/img/logo.PNG"media="(prefers-color-scheme: light)"/>
    <link rel="icon"type="image/png" href="assets/img/1.1.png" media="(prefers-color-scheme: dark)"/>
    <title>Asociados</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/estilo-asociado.css" />
    <link rel="stylesheet" href="css/perfil-dropdown.css" />
    <link rel="stylesheet" href="css/libs/custom-alerts.css" />
    <!-- Menú desplegable personalizado -->
    <link rel="stylesheet" href="css/select.css" />
    <!-- Librería de estilos para calendarios - DEBE IR AL FINAL -->
    <link rel="stylesheet" href="css/libs/calendar-select.css" />

    <!-- Estilos de modales de asociados -->
    <link rel="stylesheet" href="modales/css/asociado/modal-asociado.css" />
    <link rel="stylesheet" href="modales/css/asociado/editar-asociado.css" />
    <link rel="stylesheet" href="modales/css/asociado/modal-informacion.css" />
    <link rel="stylesheet" href="modales/css/asociado/modal-compra.css" />
    <link rel="stylesheet" href="modales/css/asociado/modal-venta.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"rel="stylesheet"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  </head>

  <body>
     <div id="menu-placeholder"></div>
    <div class="container">
    
      <div class="main-content">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <main class="content">
          <div class="search-section">
            <div class="search-and-new">
              <div class="search-bar">
                <div class="search-inner">
                  <i class="fas fa-search"></i>
                  <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar asociado"
                  />
                </div>
              </div>

              <button id="btnNuevo" class="btn btn-new">
                + Nuevo asociado
              </button>
            </div>

            <div class="filters">
              <div class="filter-group">
                <label>Fecha desde</label>
                <input type="text" id="fechaDesdeAsociado" placeholder="Seleccionar fecha" />
              </div>

              <div class="filter-group">
                <label>Fecha hasta</label>
                <input type="text" id="fechaHastaAsociado" placeholder="Seleccionar fecha" />
              </div>

              <div class="filter-group">
                <label>Estado</label>
                <select id="estadoAsociado">
                  <option>Todos</option>
                  <option>Activo</option>
                  <option>Inactivo</option>
                </select>
              </div>

              <div class="filter-actions">
                <button class="btn btn-clear">Limpiar filtros</button>
                <button class="btn btn-apply">Aplicar filtros</button>
              </div>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Documento</th>
                  <th>Contacto</th>
                  <th>Ingresos</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="asociadosTbody"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- Contenedor para modales de asociados (se cargan dinámicamente) -->
    <div id="modales-asociados-container"></div>

    <script src="controller/js/libs/custom-alerts.js"></script>
    <script src="controller/js/api.js"></script>
    <script src="controller/js/libs/select.js"></script>
    <script src="controller/js/libs/init-calendarios.js"></script>
    <script src="controller/js/modal-manager.js"></script>
    <script src="controller/js/botones-globales.js"></script>
    <script src="controller/js/carga-menu.js"></script>
    <script src="controller/js/carga-header.js"></script>
    <script src="controller/js/perfil-dropdown.js"></script>
    <script src="controller/js/carga-modales-asociados.js"></script>
    <script src="controller/js/app-asociados.js"></script>
  </body>
</html>
