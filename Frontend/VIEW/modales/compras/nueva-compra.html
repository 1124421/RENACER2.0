<div id="nuevaCompraModal" class="modal-overlay" onclick="if(event.target === this) window.closeModal('nuevaCompraModal');" style="pointer-events: auto;">
      <div class="modal-content" onclick="event.stopPropagation();" style="display: flex; flex-direction: column; max-height: 90vh; overflow: visible;">
        <div class="modal-header">
          <h2>
            <img
              class="modal-title-icon"
              src="assets/img/imagenes/shopping.svg"
              alt="Registrar Compra"
              style="
                width: 22px;
                height: 22px;
                filter: invert(63%) sepia(83%) saturate(356%) hue-rotate(78deg)
                  brightness(95%) contrast(92%);
              "
            />
            Registrar Compra
          </h2>
          <button class="close-modal" onclick="window.closeModal('nuevaCompraModal')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body" style="flex: 1; overflow-y: auto; min-height: 0;">
          <div class="form-section">
            <h3 class="section-title">Seleccionar Asociado</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
              <button type="button" id="btnAsociadoInscrito" class="btn-tab-asociado active" style="flex: 1; padding: 10px; background: #2d5a47; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Asociado Inscrito
              </button>
              <button type="button" id="btnUsuarioSinRegistrar" class="btn-tab-asociado" style="flex: 1; padding: 10px; background: #e5e7eb; color: #374151; border: none; border-radius: 4px; cursor: pointer;">
                Usuario sin Registrar
              </button>
            </div>
            <div id="panelAsociadoInscrito" class="panel-asociado">
              <div class="form-group">
                <div class="search-input">
                  <img
                    class="search-icon"
                    src="assets/img/imagenes/search.svg"
                    alt="Buscar"
                  />
                  <input
                    type="text"
                    placeholder="Buscar asociado inscrito"
                    id="searchAsociadoCompra"
                  />
                </div>
              </div>
              <div id="asociadoSeleccionadoInfo" style="margin-top: 10px; padding: 10px; background: #f3f4f6; border-radius: 4px; display: none;">
                <strong>Asociado seleccionado:</strong>
                <div id="asociadoInfoText"></div>
                <div id="asociadoCarretaRuta" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd;">
                  <div id="asociadoCarretaText" style="margin-bottom: 4px;"></div>
                  <div id="asociadoRutaText"></div>
                </div>
              </div>
            </div>
            <div id="panelUsuarioSinRegistrar" class="panel-asociado" style="display: none;">
              <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="usuarioSinRegistrarNombre" placeholder="Nombre" />
              </div>
              <div class="form-group">
                <label>Apellido</label>
                <input type="text" id="usuarioSinRegistrarApellido" placeholder="Apellido" />
              </div>
              <div class="form-group">
                <label>Documento</label>
                <input type="text" id="usuarioSinRegistrarDocumento" placeholder="Número de documento" />
              </div>
              <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="usuarioSinRegistrarTelefono" placeholder="Teléfono" />
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3 class="section-title">Seleccionar Materiales (del Inventario)</h3>
            <div class="form-group">
              <div class="search-input">
                <img
                  class="search-icon"
                  src="assets/img/imagenes/search.svg"
                  alt="Buscar"
                />
                <input
                  type="text"
                  placeholder="Buscar materiales disponibles"
                  id="searchMaterialCompra"
                />
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3 class="section-title">Materiales agregados</h3>
            <div class="added-items">
              <p style="text-align: center; color: #999; padding: 20px;">No hay materiales agregados</p>
            </div>
          </div>

        </div>
        <div class="modal-footer" style="display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10000; flex-shrink: 0; pointer-events: auto !important;">
          <div style="font-size: 1.2rem; font-weight: bold;">
            <span>Total de la compra: </span>
            <span id="totalCompraModal" style="color: #2d5a47;">$0.00</span>
          </div>
          <div style="display: flex; gap: 10px; pointer-events: auto !important;">
            <button class="btn-secondary" onclick="event.stopPropagation(); window.closeModal('nuevaCompraModal'); return false;">
              Cancelar
            </button>
            <button type="button" class="btn-primary" id="btnFinalizarCompra" style="background: #2d5a47; padding: 10px 30px; cursor: pointer !important; border: none; color: white; border-radius: 4px; position: relative; z-index: 99999 !important; pointer-events: auto !important; user-select: none;">
              Finalizar Compra
            </button>
          </div>
        </div>
      </div>
    </div>
