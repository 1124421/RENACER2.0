<!-- Modal Nuevo Asociado -->
<div id="asociadoModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>
        <img
          class="modal-title-icon"
          src="assets/img/imagenes/usersolo.svg"
          alt="Nuevo Asociado"
          style="
            width: 22px;
            height: 22px;
            filter: invert(63%) sepia(83%) saturate(356%) hue-rotate(78deg)
              brightness(95%) contrast(92%);
          "
        />
        Nuevo Asociado
      </h2>
      <button class="close-modal" onclick="window.closeModal('asociadoModal')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <h3 class="section-title">Datos del Asociado (Datos Personales)</h3>
        <div class="form-group">
          <label>Nombre completo del asociado</label>
          <input type="text" id="newNombre" placeholder="Ingrese aquí" />
        </div>
        <div class="form-group">
          <label>Documento</label>
          <input type="text" id="newDocumento" placeholder="Ingrese aquí" />
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="newContacto" placeholder="Ingrese aquí" />
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="newCorreo" placeholder="Ingrese aquí" />
        </div>
      </div>

      <div class="form-section">
        <h3 class="section-title">Datos Laborales</h3>
        <div class="form-group">
          <label>Fecha de Inicio</label>
          <input type="text" id="newFechaInicio" class="flatpickr-input" placeholder="Seleccionar fecha" />
        </div>
        <div class="form-group">
          <label>Tipo de contrato</label>
          <input type="text" id="newTipoContrato" placeholder="Ingrese aquí" />
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <input type="text" id="newCargo" placeholder="Ingrese aquí" />
        </div>
        <div class="form-group">
          <label>ID</label>
          <input type="text" id="newIdUnico" placeholder="Ingrese aquí" />
        </div>
        <div class="form-group">
          <label>Tipo de asociado</label>
          <select id="newTipoAsociado">
            <option value="">Seleccione una opción</option>
            <option value="Aforado">Aforado</option>
            <option value="No_aforado">No aforado</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="window.closeModal('asociadoModal')">
        Cancelar
      </button>
      <button class="btn-primary" id="btnGuardarNuevo" onclick="if(typeof window.guardarNuevoAsociado === 'function') { window.guardarNuevoAsociado(event); } else { console.error('window.guardarNuevoAsociado no disponible'); alert('Error: Por favor recargue la página.'); }">Guardar</button>
    </div>
  </div>
</div>
