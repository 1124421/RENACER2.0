<div id="editarVentaModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Editar Venta</h2>
      <button class="close-modal" onclick="window.closeModal('editarVentaModal')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <h3 class="section-title">Información de la Venta</h3>
        <div class="form-group">
          <label>Cliente</label>
          <select id="editClienteVenta" class="custom-select">
            <option value="">Seleccione un cliente</option>
          </select>
        </div>
      </div>
      <div class="form-section">
        <h3 class="section-title">Detalles de Materiales</h3>
        <div id="editDetallesVenta">
          <!-- Detalles se cargan dinámicamente -->
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="window.closeModal('editarVentaModal')">
        Cancelar
      </button>
      <button class="btn-primary" id="btnGuardarEditarVenta">Guardar</button>
    </div>
  </div>
</div>
