<div id="modalVerCompra" class="modal-overlay" style="display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="modal-content" style="width: 90% !important; max-width: 1200px !important; max-height: 95vh !important; overflow-y: auto !important; margin: 0 auto !important; position: relative !important;">
    <div class="modal-header" style="background: linear-gradient(135deg, #2d5a47 0%, #1e3d2f 100%); color: white; border-radius: 0.75rem 0.75rem 0 0; padding: 1.5rem 2rem;">
      <h2 style="color: white; margin: 0; font-size: 1.75rem;">Ver Compra</h2>
      <button class="close-modal" onclick="window.closeModal('modalVerCompra')" style="color: white; font-size: 1.5rem;">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body" style="padding: 2.5rem; display: block !important; visibility: visible !important; min-height: 200px; width: 100%; box-sizing: border-box;">
      <div class="form-section" style="display: block !important; visibility: visible !important; opacity: 1 !important; margin-bottom: 2rem; background: #f9fafb; padding: 2rem; border-radius: 8px; border: 1px solid #e5e7eb;">
        <h3 class="section-title" style="color: #2d5a47; font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid #2d5a47;">Información General</h3>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; width: 100%; box-sizing: border-box;">
          <div class="form-group" style="display: block !important; visibility: visible !important;">
            <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.75rem; font-size: 1rem;">ID Compra</label>
            <p id="viewCompraId" style="margin: 0; padding: 14px 16px; color: #1f2937; font-size: 1.125rem; background: white; border-radius: 6px; border: 1px solid #e5e7eb; display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 24px; font-weight: 500;">-</p>
          </div>
          <div class="form-group" style="display: block !important; visibility: visible !important;">
            <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.75rem; font-size: 1rem;">Fecha</label>
            <p id="viewCompraFecha" style="margin: 0; padding: 14px 16px; color: #1f2937; font-size: 1.125rem; background: white; border-radius: 6px; border: 1px solid #e5e7eb; display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 24px; font-weight: 500;">-</p>
          </div>
          <div class="form-group" style="display: block !important; visibility: visible !important;">
            <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.75rem; font-size: 1rem;">Asociado</label>
            <p id="viewCompraAsociado" style="margin: 0; padding: 14px 16px; color: #1f2937; font-size: 1.125rem; background: white; border-radius: 6px; border: 1px solid #e5e7eb; display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 24px; font-weight: 500;">-</p>
          </div>
          <div class="form-group" style="display: block !important; visibility: visible !important;">
            <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.75rem; font-size: 1rem;">Documento</label>
            <p id="viewCompraDocumento" style="margin: 0; padding: 14px 16px; color: #1f2937; font-size: 1.125rem; background: white; border-radius: 6px; border: 1px solid #e5e7eb; display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 24px; font-weight: 500;">-</p>
          </div>
          <div class="form-group" style="display: block !important; visibility: visible !important;">
            <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.75rem; font-size: 1rem;">Barrio/Ruta</label>
            <p id="viewCompraBarrio" style="margin: 0; padding: 14px 16px; color: #1f2937; font-size: 1.125rem; background: white; border-radius: 6px; border: 1px solid #e5e7eb; display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 24px; font-weight: 500;">-</p>
          </div>
          <div class="form-group" style="display: block !important; visibility: visible !important;">
            <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.75rem; font-size: 1rem;">Carreta</label>
            <p id="viewCompraCarreta" style="margin: 0; padding: 14px 16px; color: #1f2937; font-size: 1.125rem; background: white; border-radius: 6px; border: 1px solid #e5e7eb; display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 24px; font-weight: 500;">-</p>
          </div>
          <div class="form-group" style="display: block !important; visibility: visible !important; grid-column: span 2;">
            <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.75rem; font-size: 1rem;">Total Pagado</label>
            <p id="viewCompraTotal" style="margin: 0; padding: 14px 16px; color: #2d5a47; font-size: 1.5rem; background: white; border-radius: 6px; border: 2px solid #2d5a47; display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 24px; font-weight: bold;">-</p>
          </div>
        </div>
      </div>
      <div class="form-section" style="display: block !important; visibility: visible !important; opacity: 1 !important; background: #f9fafb; padding: 2rem; border-radius: 8px; border: 1px solid #e5e7eb;">
        <h3 class="section-title" style="color: #2d5a47; font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid #2d5a47;">Detalles de Materiales</h3>
        <div style="overflow-x: visible; width: 100%; box-sizing: border-box;">
          <table style="width: 100% !important; border-collapse: collapse; display: table !important; visibility: visible !important; background: white; border-radius: 6px; overflow: hidden; table-layout: auto;">
            <thead>
              <tr style="background: #2d5a47 !important;">
                <th style="padding: 16px; text-align: left; font-weight: 600; font-size: 1rem; color: white !important;">Material</th>
                <th style="padding: 16px; text-align: right; font-weight: 600; font-size: 1rem; color: white !important;">Cantidad (Kg)</th>
                <th style="padding: 16px; text-align: right; font-weight: 600; font-size: 1rem; color: white !important;">Precio por Kg</th>
                <th style="padding: 16px; text-align: left; font-weight: 600; font-size: 1rem; color: white !important;">Bodega Destino</th>
                <th style="padding: 16px; text-align: right; font-weight: 600; font-size: 1rem; color: white !important;">Subtotal</th>
              </tr>
            </thead>
            <tbody id="viewCompraDetalles" style="display: table-row-group !important; visibility: visible !important;">
              <tr>
                <td colspan="5" style="text-align: center; padding: 30px; color: #6b7280;">No hay detalles</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="modal-footer" style="padding: 1.5rem; border-top: 1px solid #e5e7eb; background: #f9fafb; border-radius: 0 0 0.75rem 0.75rem;">
      <button class="btn-secondary" onclick="window.closeModal('modalVerCompra')" style="padding: 10px 24px; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s;">
        Cerrar
      </button>
    </div>
  </div>
</div>
